[package]
name = "aegis-engine"
version = "0.1.0"
edition = "2021"
description = "Side-Channel Resistant Constant-Time Cauchy-Mersenne Secret Sharing Engine"
authors = ["Aegis Security Team"]

[dependencies]
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
rand_chacha = "0.3"
