[package]
name = "aegis-cli"
version = "0.1.0"
edition = "2021"
description = "AegisAgent CLI & Enclave Gateway"
authors = ["Aegis Security Team"]

[dependencies]
aegis-engine = { path = "../aegis-engine" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = "1.7"
rand = "0.8"
